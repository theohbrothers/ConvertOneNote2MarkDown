name: ci-master-pr

on:
  push:
    branches:
    - master
    tags:
    - '**'
  pull_request:
    branches:
    - master

jobs:
  test-powershell-5-1-windows-2022:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: Powershell version
      run: |
        powershell -NoLogo -NonInteractive -NoProfile -Command '$PSVersionTable'
    - name: Test
      run: |
        powershell -NoLogo -NonInteractive -NoProfile -Command './test/test.ps1'

  ##########
  # Docker #
  ##########
  test-powershell-7-1:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/powershell:7.1.5-ubuntu-20.04
    steps:
    - uses: actions/checkout@v4
    - name: Powershell version
      run: |
        pwsh -NoLogo -NonInteractive -NoProfile -Command '$PSVersionTable'
    - name: Test
      run: |
        pwsh -NoLogo -NonInteractive -NoProfile -Command './test/test.ps1'

  test-powershell-7-2:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/powershell:7.2.2-ubuntu-20.04
    steps:
    - uses: actions/checkout@v4
    - name: Powershell version
      run: |
        pwsh -NoLogo -NonInteractive -NoProfile -Command '$PSVersionTable'
    - name: Test
      run: |
        pwsh -NoLogo -NonInteractive -NoProfile -Command './test/test.ps1'

  test-powershell-7-3:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/powershell:7.3-ubuntu-20.04
    steps:
    - uses: actions/checkout@v4
    - name: Powershell version
      run: |
        pwsh -NoLogo -NonInteractive -NoProfile -Command '$PSVersionTable'
    - name: Test
      run: |
        pwsh -NoLogo -NonInteractive -NoProfile -Command './test/test.ps1'

  test-powershell-7-4:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Powershell version
      run: |
        pwsh -NoLogo -NonInteractive -NoProfile -Command '$PSVersionTable'
    - name: Test
      run: |
        pwsh -NoLogo -NonInteractive -NoProfile -Command './test/test.ps1'

  update-draft-release:
    needs:
      - test-powershell-5-1-windows-2022
      - test-powershell-7-1
      - test-powershell-7-2
      - test-powershell-7-3
      - test-powershell-7-4
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "master"
      - uses: release-drafter/release-drafter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-draft-release:
    needs:
      - test-powershell-5-1-windows-2022
      - test-powershell-7-1
      - test-powershell-7-2
      - test-powershell-7-3
      - test-powershell-7-4
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - id: release-drafter
      uses: release-drafter/release-drafter@v5
      with:
        # config-name: release-drafter.yaml
        publish: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
